<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CR Clone" />
    <meta name="theme-color" content="#0f1829" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <title>Clash Royale Clone</title>
    <style>
      /* ── Critical baseline: prevents a white/unstyled flash before the
         Vite-bundled CSS loads.  All other rules live in src/ui/style.css
         and src/ui/tokens.css, imported by main.ts. ── */
      html,
      body {
        margin: 0;
        background: #0f1829;
        height: 100%;
        overflow: hidden;
      }
      #app {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        width: min(100vw, 52vh);
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar"></div>
      <div id="stage">
        <div id="banner" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="emote-bar" id="emotes" aria-label="Emotes" role="group"></div>
      </div>
      <div id="hud"></div>
    </div>
    <div id="overlay"></div>
    <div id="deckpicker"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
