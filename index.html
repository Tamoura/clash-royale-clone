<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crown Rush" />
    <meta name="theme-color" content="#0f1829" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <!-- The offline shell marker: public/sw.js keeps a page as the offline
         shell only when it carries this line (src/app/sw.test.ts). It is not
         the title, so renaming the game never breaks offline play. -->
    <meta name="cr-app-shell" content="game" />
    <!-- The game's name. src/app/brand.ts renames the tab in the Golden Age
         edition at runtime; src/app/brand.test.ts keeps these in step. -->
    <title>Crown Rush</title>
    <style>
      /* ── Critical baseline: prevents a white/unstyled flash before the
         Vite-bundled CSS loads.  All other rules live in src/ui/style.css
         and src/ui/tokens.css, imported by main.ts. ── */
      html,
      body {
        margin: 0;
        background: #0f1829;
        height: 100%;
        overflow: hidden;
      }
      #app {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        width: min(100vw, max(52vh, 420px));
        margin: 0 auto;
      }
      /* ── Boot splash: drawn before any script or font loads, and up until
         the game's first frame (main.ts adds body.booted). The boot script
         below adds a calm "still loading" line after 12 s and a big "Tap to
         try again" on a boot error or after 45 s, so a slow device never
         stares at an empty page and a failed boot is never a dead end. ── */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 38%, #1d2a47 0%, #0f1829 70%);
        color: #f3f5fa;
        font: 400 26px/1.2 "Lilita One", "Baloo Bhaijaan 2", "Trebuchet MS", system-ui, sans-serif;
        text-align: center;
      }
      body.booted #boot {
        display: none;
      }
      #boot .boot-crest {
        position: relative;
        width: 84px;
        height: 96px;
        background: linear-gradient(180deg, #ffd23f, #d9912b);
        clip-path: polygon(50% 0, 100% 14%, 100% 58%, 50% 100%, 0 58%, 0 14%);
      }
      #boot .boot-crest::after {
        content: "";
        position: absolute;
        inset: 9px;
        background: linear-gradient(180deg, #2a72d4, #14203a);
        clip-path: polygon(50% 0, 100% 14%, 100% 58%, 50% 100%, 0 58%, 0 14%);
      }
      #boot .boot-crest::before {
        content: "";
        position: absolute;
        z-index: 1;
        left: 24px;
        top: 30px;
        width: 36px;
        height: 26px;
        background: #ffd23f;
        clip-path: polygon(0 100%, 0 20%, 25% 55%, 50% 0, 75% 55%, 100% 20%, 100% 100%);
      }
      #boot .boot-title {
        margin: 0 24px;
        text-shadow: 0 3px 0 #1a1030;
      }
      #boot .boot-bar {
        position: relative;
        width: 160px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #0b1322;
        box-shadow: inset 0 0 0 1px #2e4470;
      }
      #boot .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: #f6c14e;
        animation: bootBar 1.1s ease-in-out infinite;
      }
      @keyframes bootBar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      #boot .boot-note {
        min-height: 1.3em;
        margin: 0 24px;
        color: #c9d4ea;
        font: 400 19px/1.3 "Lilita One", "Baloo Bhaijaan 2", "Trebuchet MS", system-ui, sans-serif;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #boot.is-slow .boot-note {
        opacity: 1;
      }
      #boot .boot-retry {
        min-width: 240px;
        min-height: 64px;
        margin: 6px 24px 0;
        padding: 14px 30px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffd23f, #e8a72e);
        color: #1a1030;
        font: 400 26px/1.15 "Lilita One", "Baloo Bhaijaan 2", "Trebuchet MS", system-ui, sans-serif;
        box-shadow: 0 5px 0 #a8661c, 0 10px 24px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #boot .boot-retry[hidden] {
        display: none;
      }
      #boot .boot-retry:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #a8661c, 0 6px 16px rgba(0, 0, 0, 0.35);
      }
      #boot.is-failed {
        cursor: pointer;
      }
      #boot.is-failed .boot-bar,
      #boot.is-failed .boot-note {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar::after { animation: none; width: 100%; opacity: 0.6; }
        #boot .boot-note { transition: none; }
      }
    </style>
    <script id="boot-script">
      /* The boot splash's watcher (src/app/bootSplash.test.ts runs it). It
         starts before the game's own scripts, so it is plain old JavaScript
         and needs nothing from them. The splash stays until the game's first
         frame (main.ts adds body.booted); after 12 s it adds a calm "still
         loading" line; on a boot error (an uncaught error, or a script,
         style or module chunk that failed to load) or after 45 s it offers a
         big "Tap to try again", which reloads asking the worker for the
         newest page (?cr-fresh, see public/sw.js). The words follow the
         saved edition: Arabic, right to left on the splash text only, in
         the Golden Age edition (cr-clone-arena-theme = "arabic"). A boot
         error or the 45 s retry also goes in the local problem log
         (Settings > Help > Problem report); nothing leaves the device. */
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("cr-clone-arena-theme");
        } catch (e) {}
        var arabic = theme === "arabic";
        var words = arabic
          ? { name: "هجمة التاج", slow: "ما زالت اللعبة تُحمَّل… اقتربنا!", retry: "اضغط لتحاول مجددًا" }
          : { name: "Crown Rush", slow: "Still loading… nearly there!", retry: "Tap to try again" };
        var failed = false;
        var booted = function () {
          return !!document.body && document.body.classList.contains("booted");
        };
        // The splash once the page is parsed: "interactive" comes before the
        // game's (deferred) module scripts run, unlike DOMContentLoaded.
        var withSplash = function (fn) {
          var boot = document.getElementById("boot");
          if (boot) return fn(boot);
          var parsed = function () {
            document.removeEventListener("readystatechange", parsed);
            var later = document.getElementById("boot");
            if (later) fn(later);
          };
          document.addEventListener("readystatechange", parsed);
        };
        // One tap, one reload: on a failed splash the button and the splash
        // both listen, and a tap on the button reaches both. A second call
        // within 2 s would only abort the first reload; a later tap (if that
        // reload stalled) tries again.
        var retriedAt = -Infinity;
        var retry = function () {
          var now = Date.now();
          if (now - retriedAt < 2000) return;
          retriedAt = now;
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("cr-fresh", Date.now().toString(36));
            window.location.replace(url.href);
          } catch (e) {
            window.location.reload();
          }
        };
        // "https://host/a/b.js?v=1" -> "/a/b.js" (shorter, and no address).
        var path = function (url) {
          return String(url || "").replace(/^[a-z][a-z0-9+.-]*:\/\/[^\/]*/i, "").replace(/[?#].*$/, "") || "?";
        };
        // The problem log (src/app/problemLog.ts), so a grown-up can find a
        // boot problem after the next good start. Once the game's error
        // traps run (src/app/errorTraps.ts) they take it: they cancel the
        // event, and skip a "seen" one (a page error they record anyway).
        // Before that (the game's files did not load or run) it is written
        // to storage in the log's own shape, which the log cleans again when
        // it reads it. Never throws.
        var logBoot = function (msg, seen) {
          try {
            msg = String(msg).replace(/\s+/g, " ").slice(0, 200);
            try {
              var ev = new CustomEvent("cr-boot-problem", { cancelable: true, detail: { msg: msg, seen: seen } });
              if (!window.dispatchEvent(ev)) return;
            } catch (e) {}
            var key = "cr-clone-problem-log";
            var store = window.localStorage;
            var list = [];
            try {
              list = JSON.parse(store.getItem(key) || "[]");
            } catch (e) {}
            if (!Array.isArray(list)) list = [];
            var now = Date.now();
            var entry = null;
            for (var i = 0; i < list.length; i++) {
              if (list[i] && list[i].msg === msg) {
                entry = list.splice(i, 1)[0];
                break;
              }
            }
            if (entry) {
              entry.n = (typeof entry.n === "number" ? entry.n : 1) + 1;
              entry.last = now;
            } else {
              var page = "";
              try {
                var main = document.querySelector('script[type="module"][src]');
                if (main) page = "page " + path(main.getAttribute("src"));
              } catch (e) {}
              entry = {
                at: now, last: now, n: 1, kind: "error", where: "boot splash", msg: msg,
                stack: page ? [page] : [], build: "?", screen: "boot", quality: "?",
                edition: arabic ? "golden-age" : theme === "normal" ? "classic" : "unset", online: false,
              };
            }
            list.unshift(entry);
            store.setItem(key, JSON.stringify(list.slice(0, 20)));
          } catch (e) {}
        };
        var offerRetry = function (boot) {
          var button = boot.querySelector(".boot-retry");
          if (!button || !button.hidden) return;
          button.hidden = false;
          button.addEventListener("click", retry);
        };
        var slow = function () {
          if (booted() || failed) return;
          withSplash(function (boot) {
            boot.classList.add("is-slow");
          });
        };
        var late = function () {
          if (booted() || failed) return;
          logBoot("The game was not ready after 45 s (Tap to try again shown)", false);
          withSplash(offerRetry);
        };
        var fail = function (msg, seen) {
          if (booted() || failed) return;
          failed = true;
          logBoot(msg, seen);
          withSplash(function (boot) {
            boot.classList.add("is-failed");
            offerRetry(boot);
            boot.addEventListener("click", retry);
          });
        };
        // The portrait studio (?gallery=, a dev tool) draws its own page.
        if (/[?&]gallery=/.test(window.location.search)) {
          return withSplash(function () {
            document.body.classList.add("booted");
          });
        }
        withSplash(function (boot) {
          var set = function (sel, text) {
            var node = boot.querySelector(sel);
            if (!node) return;
            node.textContent = text;
            if (arabic) {
              node.setAttribute("dir", "rtl");
              node.setAttribute("lang", "ar");
            }
          };
          set(".boot-title", words.name);
          set(".boot-note", words.slow);
          set(".boot-retry", words.retry);
        });
        window.setTimeout(slow, 12000);
        window.setTimeout(late, 45000);
        // Capture phase: a script or style that fails to load fires on its
        // element and does not bubble. Images and fonts are not the boot.
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (el && el !== window && el.tagName) {
              var tag = el.tagName.toUpperCase();
              var style = tag === "LINK" && /stylesheet|modulepreload/i.test(el.rel || "");
              if (tag !== "SCRIPT" && !style) return;
              // Not seen by the traps: a load error does not bubble.
              return fail("A game file did not load: " + path(el.src || el.href), false);
            }
            var at = e.filename ? " at " + path(e.filename) + ":" + (e.lineno || 0) : "";
            fail("Boot error: " + (e.message || "Script error") + at, true);
          },
          true,
        );
        // A module chunk that failed to load (a dynamic import nobody caught).
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason;
          var text = String((reason && reason.message) || reason || "");
          if (/dynamically imported module|Importing a module script failed|Unable to preload CSS/i.test(text)) fail("Boot error: " + text, true);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="topbar"></div>
      <div id="stage">
        <div id="banner" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="emote-bar" id="emotes" aria-label="Emotes" role="group"></div>
      </div>
      <div id="hud"></div>
    </div>
    <div id="overlay"></div>
    <div id="impact-flash" aria-hidden="true"></div>
    <div id="deckpicker"></div>
    <div id="boot">
      <div class="boot-crest" aria-hidden="true"></div>
      <div class="boot-title">Crown Rush</div>
      <div class="boot-bar" aria-hidden="true"></div>
      <p class="boot-note" role="status" aria-live="polite"></p>
      <button class="boot-retry" type="button" hidden>Tap to try again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
