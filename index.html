<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CR Clone" />
    <meta name="theme-color" content="#0f1829" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <title>Clash Royale Clone</title>
    <style>
      /* ── Critical baseline: prevents a white/unstyled flash before the
         Vite-bundled CSS loads.  All other rules live in src/ui/style.css
         and src/ui/tokens.css, imported by main.ts. ── */
      html,
      body {
        margin: 0;
        background: #0f1829;
        height: 100%;
        overflow: hidden;
      }
      #app {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        width: min(100vw, 52vh);
        margin: 0 auto;
      }
      /* ── Boot splash: drawn before any script or font loads, hidden once
         the page has loaded (body.booted). The delayed fade is a fallback
         so a failed boot never leaves the splash up for good. ── */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 38%, #1d2a47 0%, #0f1829 70%);
        color: #f3f5fa;
        font: 400 26px/1.2 "Lilita One", "Trebuchet MS", system-ui, sans-serif;
        text-align: center;
        animation: bootOut 0.3s 10s forwards;
      }
      body.booted #boot {
        display: none;
      }
      #boot .boot-crest {
        position: relative;
        width: 84px;
        height: 96px;
        background: linear-gradient(180deg, #ffd23f, #d9912b);
        clip-path: polygon(50% 0, 100% 14%, 100% 58%, 50% 100%, 0 58%, 0 14%);
      }
      #boot .boot-crest::after {
        content: "";
        position: absolute;
        inset: 9px;
        background: linear-gradient(180deg, #2a72d4, #14203a);
        clip-path: polygon(50% 0, 100% 14%, 100% 58%, 50% 100%, 0 58%, 0 14%);
      }
      #boot .boot-crest::before {
        content: "";
        position: absolute;
        z-index: 1;
        left: 24px;
        top: 30px;
        width: 36px;
        height: 26px;
        background: #ffd23f;
        clip-path: polygon(0 100%, 0 20%, 25% 55%, 50% 0, 75% 55%, 100% 20%, 100% 100%);
      }
      #boot .boot-title {
        margin: 0 24px;
        text-shadow: 0 3px 0 #1a1030;
      }
      #boot .boot-bar {
        position: relative;
        width: 160px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #0b1322;
        box-shadow: inset 0 0 0 1px #2e4470;
      }
      #boot .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: #f6c14e;
        animation: bootBar 1.1s ease-in-out infinite;
      }
      @keyframes bootBar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @keyframes bootOut {
        to { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar::after { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar"></div>
      <div id="stage">
        <div id="banner" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="emote-bar" id="emotes" aria-label="Emotes" role="group"></div>
      </div>
      <div id="hud"></div>
    </div>
    <div id="overlay"></div>
    <div id="impact-flash" aria-hidden="true"></div>
    <div id="deckpicker"></div>
    <div id="boot" aria-hidden="true">
      <div class="boot-crest"></div>
      <div class="boot-title">Clash Royale Clone</div>
      <div class="boot-bar"></div>
    </div>
    <script>
      addEventListener("load", () => document.body.classList.add("booted"));
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
