<!doctype html>
<!-- Dev-only contact sheet of the KIT TROOPS (src/render3d/kitTroops.ts), under the battle's light and camera angle:
     open /tools/troopview.html on the dev server. Rows: yours from the front, yours from behind (how you see them
     in battle), the enemy's from the front, mid-attack. ?cards=knight,giant&zoom=2 narrows it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Troop contact sheet</title>
    <style>
      html, body { margin: 0; background: #7fc957; overflow: hidden; }
      .tag { position: absolute; font: 11px/1 monospace; color: #fff; background: rgba(0, 0, 0, 0.6); padding: 2px 3px; transform: translate(-50%, 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { loadKitTroops, makeKitTroop, animateKitTroop, kitTroopCards } from "/src/render3d/kitTroops.ts";
      const q = new URLSearchParams(location.search);
      const cards = (q.get("cards") || "knight,archers,giant,wizard,valkyrie,mini-pekka,musketeer,skeletons,witch").split(",");
      const cell = 3.4;
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7fc957);
      scene.add(new THREE.HemisphereLight(0xcfe2ff, 0x7d9a5c, 0.78));
      const sun = new THREE.DirectionalLight(0xffe6b8, 2.15);
      sun.position.set(-10, 18, -3.5);
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0x9fc4ff, 0.6);
      rim.position.set(-8, 10, -14);
      scene.add(rim);
      const fill = new THREE.DirectionalLight(0xa9c8ff, 0.38);
      fill.position.set(9, 9, 12);
      scene.add(fill);
      await loadKitTroops();
      const rows = [
        ["player", 0, "idle"],
        ["player", Math.PI, "walk"],
        ["enemy", 0, "idle"],
        ["enemy", 0.5, "attack"],
      ];
      const aspect = innerWidth / innerHeight;
      const halfW = (cards.length * cell) / 2 + 0.5;
      const cam = new THREE.OrthographicCamera(-halfW, halfW, halfW / aspect, -halfW / aspect, -100, 200);
      const cz = (rows.length * cell) / 2 - cell * 0.85;
      cam.position.set(0, 30, 26 + cz);
      cam.lookAt(0, 0, cz);
      const tags = [];
      cards.forEach((card, i) => {
        rows.forEach(([team, yaw, pose], r) => {
          const u = makeKitTroop(card, team);
          if (!u) return;
          const x = (i - (cards.length - 1) / 2) * cell;
          const z = r * cell;
          const holder = new THREE.Group();
          holder.position.set(x, 0, z);
          holder.rotation.y = yaw;
          holder.add(u.group);
          scene.add(holder);
          const s = { moving: pose === "walk", attacking: pose === "attack", cooldown: 0.02, hitSpeed: 1.2, rate: 1, frozen: false };
          for (let k = 0; k < 30; k++) animateKitTroop(u, s, 0.033);
          if (r === 0) tags.push({ name: `${card} h${u.height.toFixed(2)}`, p: new THREE.Vector3(x, 0, -1.9) });
        });
      });
      renderer.render(scene, cam);
      for (const t of tags) {
        const v = t.p.clone().project(cam);
        const el = document.createElement("div");
        el.className = "tag";
        el.textContent = t.name;
        el.style.left = `${((v.x + 1) / 2) * innerWidth}px`;
        el.style.top = `${((1 - v.y) / 2) * innerHeight}px`;
        document.body.appendChild(el);
      }
      window.__cards = kitTroopCards();
      window.__done = true;
    </script>
  </body>
</html>
